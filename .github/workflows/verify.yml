name: verify

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: rustup show active-toolchain
      - name: Run gate
        run: bash scripts/verify.sh
      - name: Upload gate evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gate-evidence
          path: |
            gate.log
            gate-result.txt
      - name: Fail after evidence is uploaded
        if: always() && hashFiles('gate-result.txt') != ''
        run: test "$(grep '^fail=' gate-result.txt | cut -d= -f2)" = 0
