[package]
name = "yi-edit"
description = "Yi Edit —— 极简跳平台代码编辑器"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
yi-edit-core = { path = "../core" }
yi-edit-session = { path = "../session" }
eframe = "0.36"
egui = "0.36"
image = { version = "0.25", default-features = false, features = ["png"] }

[[bin]]
name = "yi-edit"
path = "src/main.rs"

[[bin]]
name = "yi-shotcheck"
path = "src/bin/shotcheck.rs"

# 不开窗口的字体探测：截图只在 Linux 上拍，而豆腐块只在其他平台上发生。
[[bin]]
name = "yi-fontprobe"
path = "src/bin/fontprobe.rs"
