[workspace]
resolver = "2"
# 成员集合与 crates/ 下的目录集合必须相等（双向），crates/meta/tests/registry.rs 有断言在守。
members = [
  "crates/app",
  "crates/core",
  "crates/fileio",
  "crates/meta",
  "crates/session",
]

[workspace.package]
# 版本号只有这一份真身。改它并合进主干 = 发一个新版：
# .github/workflows/release.yml 拿 `v<这个版本>` 当 tag，tag 已存在就跳过。
# 流水线里不得再抄一份版本号，crates/meta/tests/release.rs 有负向断言守着。
version = "1.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/supercubegame/yi-edit"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
